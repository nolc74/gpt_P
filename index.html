<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>포켓몬 월드 - 첫 번째 모험</title>
<style>
*{box-sizing:border-box;image-rendering:pixelated}
body{margin:0;background:#17251e;color:#fff;font-family:ui-monospace,Consolas,monospace;overflow:hidden}
#app{height:100dvh;display:flex;flex-direction:column;max-width:1100px;margin:auto;background:#253c2d}
header{padding:11px 14px;background:#263e31;border-bottom:4px solid #111f18;display:flex;justify-content:space-between;gap:8px;text-shadow:2px 2px #101a13}
header small{color:#b9d7ad;font-size:10px}
#stage{position:relative;flex:1;min-height:200px;background:#7fc77a;overflow:hidden}
canvas{width:100%;height:100%;display:block;touch-action:none;image-rendering:pixelated}
#hud{position:absolute;top:9px;left:9px;background:#172b20ed;border:3px solid #d9e9b5;box-shadow:3px 3px 0 #142018;padding:8px 10px;font-size:11px;line-height:1.8}
#hint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:#172b20ed;border:2px solid #d9e9b5;padding:6px 9px;font-size:10px;white-space:nowrap;max-width:96%;overflow:hidden}
#controls{background:#263e31;border-top:4px solid #111f18;padding:9px 14px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;gap:12px}
#pad{display:grid;grid-template-columns:42px 42px 42px;grid-template-rows:34px 34px;gap:4px}
button{border:3px solid #17251e;border-radius:0;padding:8px 11px;background:#e7d99b;color:#243323;font-family:inherit;font-weight:900;font-size:12px;box-shadow:3px 3px 0 #111b15}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #111b15}
#pad button{padding:0;touch-action:none;font-size:17px;background:#b6cf8a}
#pad .up{grid-column:2}#pad .left{grid-column:1;grid-row:2}#pad .down{grid-column:2;grid-row:2}#pad .right{grid-column:3;grid-row:2}
.secondary{background:#739a75;color:#fff}
#quick{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
#dialog{position:absolute;inset:0;background:#07140dcc;display:none;align-items:center;justify-content:center;padding:16px}
.panel{width:min(440px,100%);background:#203b2b;border:4px solid #e6e1b2;padding:17px;box-shadow:5px 5px 0 #0b170f}
.panel h2{margin:0 0 8px;color:#f4e9b8;font-size:18px}
.panel p{color:#e0ebd6;line-height:1.6;font-size:13px}
.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}
</style></head><body><div id="app">
<header><b>🌿 포켓몬 월드: 첫 번째 모험</b><small>GBA-STYLE PIXEL ART v0.5</small></header>
<div id="stage"><canvas id="game"></canvas><div id="hud">📍 초록마을 외곽<br>🎒 몬스터볼 <b id="balls">5</b>개<br>⭐ 포획 포켓몬 <b id="caught">0</b>마리</div><div id="hint">방향키 또는 아래 버튼으로 이동 · 풀숲에서 야생 포켓몬 발견!</div><div id="dialog"><div class="panel" id="panel"></div></div></div>
<div id="controls"><div id="pad"><button class="up" data-dir="up">▲</button><button class="left" data-dir="left">◀</button><button class="down" data-dir="down">▼</button><button class="right" data-dir="right">▶</button></div><div id="quick"><button id="team" class="secondary">내 포켓몬</button><button id="interact" class="secondary">조사</button></div></div>
</div>
<script>
(function(){
var canvas=document.getElementById("game"),ctx=canvas.getContext("2d"),stage=document.getElementById("stage");
var W=240,H=160,keys={},dialog=false,balls=5,team=[],encounter=null,steps=0;
var player={x:400,y:280,speed:2.6,dir:"down",walking:0};
var grass=[{x:90,y:130,w:190,h:130},{x:520,y:90,w:190,h:150},{x:300,y:340,w:230,h:100}];
var trees=[[65,55],[135,45],[730,55],[770,160],[40,370],[700,390],[170,420],[610,420]];
var species=[{name:"이상해씨",type:"풀/독",hp:22,color:"#4fba76",level:3},{name:"파이리",type:"불꽃",hp:20,color:"#f18b4b",level:3},{name:"꼬부기",type:"물",hp:24,color:"#63b9e8",level:2},{name:"구구",type:"노말/비행",hp:18,color:"#c5b5a2",level:2},{name:"캐터피",type:"벌레",hp:16,color:"#9dcc4c",level:2}];
function resize(){W=240;H=160;canvas.width=W;canvas.height=H;ctx.imageSmoothingEnabled=false}window.addEventListener("resize",resize);resize();
function block(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function matrix(rows,x,y,scale,palette){for(var j=0;j<rows.length;j++)for(var i=0;i<rows[j].length;i++){var c=rows[j][i];if(c!==".")block(x+i*scale,y+j*scale,scale,scale,palette[c]||"#fff")}}
// 16x20 trainer sprites: front, back and side views, drawn as actual pixel clusters.
var heroSprites={
 down:[
 "......BBBB......",".....BBBBBB.....","....BBHHHHBB....","....BHHHHHHB....",
 "....HHFFFFHH....",".....FEEEEF.....","......EEEE......","...RRRRRRRR.....",
 "..RRRRRRRRRR....","..RRRWWRRRRR....","..RRRWWRRRRR....","...RRRRRRRR.....",
 "...RRRRRRRR.....","....NN....NN....","....NN....NN....","...NNN....NNN...",
 "...NNN....NNN...","...DD......DD...","...DD......DD...","................"
 ],
 up:[
 "......BBBB......",".....BBBBBB.....","....BBHHHHBB....","....BHHHHHHB....",
 "....BHHHHHHB....",".....HHHHHH.....","......HHHH......","...RRRRRRRR.....",
 "..RRRRRRRRRR....","..RRRWWRRRRR....","..RRRWWRRRRR....","...RRRRRRRR.....",
 "...RRRRRRRR.....","....NN....NN....","....NN....NN....","...NNN....NNN...",
 "...NNN....NNN...","...DD......DD...","...DD......DD...","................"
 ],
 side:[
 "......BBBB......",".....BBBBBB.....","....BBHHHHBB....","....BHHHHHHB....",
 "....HHFFFFHH....",".....FEEEEF.....","......EEEE......","...RRRRRRRR.....",
 "..RRRRRRRRRR....","..RRRWWRRRRR....","..RRRWWRRRRR....","...RRRRRRRR.....",
 "...RRRRRRRR.....",".....NN...NN....",".....NN...NN....","....NNN...NNN...",
 "....NNN...NNN...","....DD.....DD...","....DD.....DD...","................"
 ]};

var npcSprite=[
".....HHHH.....",
"....HHHHHH....",
"...HHFFFFHH...",
"...HFFFFFFH...",
"....FEEEEF....",
".....EEEE.....",
"...GGGGGGGG...",
"..GGGGGGGGGG..",
"..GGGWWGGGGG..",
"..GGGWWGGGGG..",
"...GGGGGGGG...",
"...NN....NN...",
"...NN....NN...",
"..NNN....NNN..",
"..DD......DD.."
];
var treeSprite=[
"......LLLL......",
"....LLLLLLLL....",
"...LLLDDLLLLL...",
"..LLLDDDDLLLLL..",
".LLLLDDDDLLLLLL.",
".LLLLLLLLLLLLLL.",
"LLLDDLLLLLLDDLLL",
"LLLDDLLLLLLDDLLL",
".LLLLLLLLLLLLL..",
"..LLLLLLLLLLL...",
"....LLLLLLLL.....",
"......TTTT.......",
"......TTTT.......",
"......TTTT.......",
".....TTTTTT......",
".....TTTTTT......"
];

// Emerald-inspired 16px tile renderer: layered grass, path edges, water, roofs and compact trainer sprites.
function tile(x,y,base,detail,seed){
 block(x,y,16,16,base);
 if(seed%3===0){block(x+2,y+4,2,2,detail);block(x+11,y+10,2,2,detail)}
 if(seed%4===1){block(x+6,y+2,1,3,detail);block(x+7,y+3,1,2,detail)}
}
function drawGround(){
 var palette=["#70b85c","#76bd61","#7bc365","#6fb458"];
 for(var y=0;y<H;y+=16)for(var x=0;x<W;x+=16)tile(x,y,palette[((x/16*3+y/16*5)%4+4)%4],"#91cf70",(x/16*7+y/16*11)%9);
 // dirt path with alternating warm pixels and clearly readable tile seams
 for(var y=80;y<128;y+=16)for(var x=0;x<128;x+=16){
  block(x,y,16,16,"#c9a66c");block(x,y,16,2,"#d8ba83");block(x+2,y+6,3,2,"#b18d59");block(x+10,y+11,4,2,"#d9bd88");
 }
 for(var y=112;y<160;y+=16)for(var x=96;x<144;x+=16){block(x,y,16,16,"#c9a66c");block(x+3,y+4,3,2,"#b18d59");block(x+10,y+10,3,2,"#dfc38e")}
 // emerald-like pond, stepped shoreline and animated-looking highlights
 for(var y=96;y<160;y+=16)for(var x=176;x<240;x+=16){
  block(x,y,16,16,"#d5c28a");block(x+2,y+2,12,12,"#3d9fc1");block(x+4,y+4,8,8,"#4eb1cf");
  if((x+y)%32===0){block(x+4,y+5,5,2,"#a0e3e1");block(x+10,y+10,2,2,"#287fa9")}
 }
}
function drawGrass(g){
 var gx=Math.round(g.x/800*W),gy=Math.round(g.y/500*H),gw=Math.round(g.w/800*W),gh=Math.round(g.h/500*H);
 for(var y=gy;y<gy+gh;y+=16)for(var x=gx;x<gx+gw;x+=16){
  block(x,y,16,16,"#398b4c");
  block(x+1,y+3,3,8,"#4ca653");block(x+5,y+1,2,10,"#83c85b");
  block(x+8,y+4,3,9,"#2e7845");block(x+11,y+2,3,8,"#69b94e");
  block(x+4,y+11,3,3,"#a0d96b");block(x+12,y+12,2,2,"#245f3a");
 }
 for(var x=gx;x<gx+gw;x+=16){block(x,gy,16,2,"#79c75b");block(x,gy+gh-2,16,2,"#286e3e")}
}
function drawTree(x,y){
 x=x/800*W;y=y/500*H;
 block(x-5,y+9,10,18,"#765034");block(x-2,y+10,3,16,"#a87949");
 matrix(treeSprite,x-16,y-17,1,{L:"#287447",D:"#1c603c",T:"#795033"});
 block(x-11,y-9,5,3,"#55ad5b");block(x+4,y-2,4,3,"#469b50");
}
function drawPerson(x,y,color,label){
 x=x/800*W;y=y/500*H;
 block(x-7,y+10,14,3,"#4b8847");
 matrix(npcSprite,x-7,y-16,1,{H:"#765039",F:"#f1c49a",E:"#f1c49a",G:color==="#e7a34f"?"#e4a044":"#4f83ba",W:"#f3dfb1",N:"#263b65",D:"#263b65"});
 ctx.fillStyle="#203626";ctx.font="6px monospace";ctx.textAlign="center";ctx.fillText(label,x,y+22);
}
function draw(){
 drawGround();grass.forEach(drawGrass);trees.forEach(function(t){drawTree(t[0],t[1])});
 // compact red-roofed Hoenn-style town house with roof tiles, windows and doorway
 var bx=98,by=16;
 block(bx-2,by+25,66,40,"#b58b5c");block(bx,by+27,62,36,"#e8d9a5");
 block(bx-5,by+19,72,12,"#9b493d");block(bx,by+12,62,10,"#bd5b4b");
 for(var rx=bx+3;rx<bx+60;rx+=12){block(rx,by+13,2,7,"#d77a61");block(rx+5,by+19,4,2,"#853c38")}
 block(bx+9,by+33,12,12,"#4d91a5");block(bx+11,by+35,8,8,"#b8e4d8");block(bx+43,by+33,12,12,"#4d91a5");block(bx+45,by+35,8,8,"#b8e4d8");
 block(bx+27,by+44,10,19,"#755037");block(bx+29,by+47,2,2,"#e4c276");
 ctx.fillStyle="#28452d";ctx.font="6px monospace";ctx.textAlign="center";ctx.fillText("초록마을",bx+31,by+72);
 drawPerson(220,75,"#e7a34f","주민");
 var px=player.x/800*W,py=player.y/500*H;
 block(px-6,py+5,12,2,"#4c8748");
 var sprite=heroSprites[player.dir]||heroSprites.down;
 matrix(sprite,Math.round(px-8),Math.round(py-14),1,{B:"#315caa",H:"#65412c",F:"#f2c69b",E:"#f2c69b",R:"#d94b45",W:"#f0dcae",N:"#293d68",D:"#293d68"});
 if(player.walking){var step=Math.floor(player.walking/5)%2;if(step===0){block(px-5,py+5,3,2,"#293d68");block(px+2,py+5,3,2,"#293d68")}else{block(px-4,py+5,3,2,"#293d68");block(px+1,py+5,3,2,"#293d68")}}
 if(player.dir!=="up"){block(px-4,py-7,1,1,"#30251f");block(px+3,py-7,1,1,"#30251f")}
}
function inGrass(){return grass.some(function(g){return player.x>g.x&&player.x<g.x+g.w&&player.y>g.y&&player.y<g.y+g.h})}
function move(){if(dialog)return;var dx=0,dy=0;if(keys.left||keys.ArrowLeft)dx--;if(keys.right||keys.ArrowRight)dx++;if(keys.up||keys.ArrowUp)dy--;if(keys.down||keys.ArrowDown)dy++;if(dx||dy){if(Math.abs(dx)>Math.abs(dy))player.dir="side";else player.dir=dy<0?"up":"down";var l=Math.hypot(dx,dy);player.x=Math.max(15,Math.min(785,player.x+dx/l*player.speed));player.y=Math.max(25,Math.min(485,player.y+dy/l*player.speed));player.walking++;if(++steps%22===0&&inGrass()&&Math.random()<.48)startEncounter()}else player.walking=0}
function loop(){move();ctx.clearRect(0,0,W,H);draw();requestAnimationFrame(loop)}loop();
function show(html){dialog=true;document.getElementById("panel").innerHTML=html;document.getElementById("dialog").style.display="flex"}function hide(){dialog=false;document.getElementById("dialog").style.display="none"}
function startEncounter(){if(dialog)return;encounter=species[Math.floor(Math.random()*species.length)];show("<h2>⚡ 야생 "+encounter.name+" 등장!</h2><p>레벨 "+encounter.level+" · "+encounter.type+"<br>야생 포켓몬이 풀숲에서 나타났다!</p><div class='actions'><button id='throw'>몬스터볼 던지기 ("+balls+")</button><button id='run' class='secondary'>도망가기</button></div>");document.getElementById("throw").onclick=catchPokemon;document.getElementById("run").onclick=hide}
function catchPokemon(){if(balls<=0){show("<h2>몬스터볼이 부족해!</h2><p>아직 상점은 준비 중이야.</p><div class='actions'><button id='ok'>확인</button></div>");document.getElementById("ok").onclick=hide;return}balls--;document.getElementById("balls").textContent=balls;if(Math.random()<.72){team.push(encounter);document.getElementById("caught").textContent=team.length;show("<h2>🎉 포획 성공!</h2><p>"+encounter.name+"을(를) 동료로 맞이했다!</p><div class='actions'><button id='ok'>계속 모험하기</button></div>")}else{show("<h2>앗! 빠져나왔다!</h2><p>"+encounter.name+"이(가) 몬스터볼에서 탈출했다.</p><div class='actions'><button id='ok'>계속하기</button></div>")}document.getElementById("ok").onclick=hide}
document.getElementById("team").onclick=function(){var list=team.length?team.map(function(p,i){return(i+1)+". "+p.name+" · Lv."+p.level+" · "+p.type}).join("<br>"):"아직 포켓몬이 없어. 풀숲을 탐험해 보자!";show("<h2>🎒 내 포켓몬</h2><p>"+list+"</p><div class='actions'><button id='ok'>닫기</button></div>");document.getElementById("ok").onclick=hide};
document.getElementById("interact").onclick=function(){if(inGrass())startEncounter();else{show("<h2>주변 조사</h2><p>풀숲으로 들어가면 야생 포켓몬을 만날 수 있어. 마을과 연못 주변도 탐험해 보자!</p><div class='actions'><button id='ok'>확인</button></div>");document.getElementById("ok").onclick=hide}};
document.querySelectorAll("[data-dir]").forEach(function(b){var d=b.dataset.dir;b.addEventListener("pointerdown",function(e){e.preventDefault();keys[d]=true;b.setPointerCapture(e.pointerId)});["pointerup","pointercancel","lostpointercapture"].forEach(function(ev){b.addEventListener(ev,function(){keys[d]=false})})});
window.addEventListener("keydown",function(e){if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();keys[e.key]=true});window.addEventListener("keyup",function(e){keys[e.key]=false});document.getElementById("dialog").addEventListener("click",function(e){if(e.target.id==="dialog")hide()});
})();
</script></body></html>
