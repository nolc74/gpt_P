<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>포켓몬 월드 - 첫 번째 모험</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#142235;color:#fff;font-family:system-ui,"Noto Sans KR",sans-serif;overflow:hidden}#app{height:100dvh;display:flex;flex-direction:column;max-width:1100px;margin:auto}header{padding:10px 14px;background:#20334b;display:flex;justify-content:space-between;gap:8px}header small{color:#c6d7e9}#stage{position:relative;flex:1;min-height:200px}canvas{width:100%;height:100%;display:block;touch-action:none}#hud{position:absolute;top:10px;left:10px;background:#102238dd;padding:9px 12px;border-radius:10px;font-size:12px;line-height:1.7}#hint{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);background:#102238dd;padding:7px 12px;border-radius:10px;font-size:11px;white-space:nowrap}#controls{background:#20334b;padding:9px 14px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;gap:12px}#pad{display:grid;grid-template-columns:42px 42px 42px;grid-template-rows:34px 34px;gap:4px}button{border:0;border-radius:9px;padding:10px 13px;background:#7bc5e5;color:#102338;font-weight:800;font-size:14px}#pad button{padding:0;touch-action:none;font-size:18px}#pad .up{grid-column:2}#pad .left{grid-column:1;grid-row:2}#pad .down{grid-column:2;grid-row:2}#pad .right{grid-column:3;grid-row:2}.secondary{background:#405b78;color:#fff}#quick{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}#dialog{position:absolute;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:16px}.panel{width:min(440px,100%);background:#172b43;border:2px solid #a6d9ee;border-radius:16px;padding:18px;box-shadow:0 12px 40px #0008}.panel h2{margin:0 0 8px}.panel p{color:#d8e6f2;line-height:1.55}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
</style></head><body><div id="app">
<header><b>🌿 포켓몬 월드: 첫 번째 모험</b><small>웹·모바일 프로토타입 v0.2</small></header>
<div id="stage"><canvas id="game"></canvas><div id="hud">📍 초록마을 외곽<br>🎒 몬스터볼 <b id="balls">5</b>개<br>⭐ 포획 포켓몬 <b id="caught">0</b>마리</div><div id="hint">방향키 또는 아래 버튼으로 이동 · 풀숲에서 야생 포켓몬 발견!</div><div id="dialog"><div class="panel" id="panel"></div></div></div>
<div id="controls"><div id="pad"><button class="up" data-dir="up">▲</button><button class="left" data-dir="left">◀</button><button class="down" data-dir="down">▼</button><button class="right" data-dir="right">▶</button></div><div id="quick"><button id="team" class="secondary">내 포켓몬</button><button id="interact" class="secondary">조사</button></div></div>
</div>
<script>
(function(){
var canvas=document.getElementById("game"),ctx=canvas.getContext("2d"),stage=document.getElementById("stage");
var W=800,H=500,keys={},dialog=false,balls=5,team=[],encounter=null,steps=0;
var player={x:400,y:280,speed:2.6};
var grass=[{x:90,y:130,w:190,h:130},{x:520,y:90,w:190,h:150},{x:300,y:340,w:230,h:100}];
var trees=[[65,55],[135,45],[730,55],[770,160],[40,370],[700,390],[170,420],[610,420]];
var species=[{name:"이상해씨",type:"풀/독",hp:22,color:"#4fba76",level:3},{name:"파이리",type:"불꽃",hp:20,color:"#f18b4b",level:3},{name:"꼬부기",type:"물",hp:24,color:"#63b9e8",level:2},{name:"구구",type:"노말/비행",hp:18,color:"#c5b5a2",level:2},{name:"캐터피",type:"벌레",hp:16,color:"#9dcc4c",level:2}];
function resize(){var r=stage.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0)}window.addEventListener("resize",resize);resize();
function rounded(x,y,w,h,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function drawGround(){ctx.fillStyle="#8bd0dc";ctx.fillRect(0,0,W,H);for(var y=0;y<H;y+=42)for(var x=0;x<W;x+=52){ctx.fillStyle=((x/52+y/42)%2)?"#83c77e":"#8bcf84";ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+26,y-9);ctx.lineTo(x+52,y);ctx.lineTo(x+26,y+9);ctx.closePath();ctx.fill()}ctx.fillStyle="#d9c49a";ctx.beginPath();ctx.moveTo(0,H*.55);ctx.lineTo(W*.34,H*.39);ctx.lineTo(W*.47,H*.44);ctx.lineTo(W*.22,H*.67);ctx.lineTo(0,H*.72);ctx.fill();ctx.beginPath();ctx.moveTo(W*.43,H);ctx.lineTo(W*.53,H);ctx.lineTo(W*.65,H*.55);ctx.lineTo(W*.57,H*.51);ctx.fill();ctx.fillStyle="#56b9d5";ctx.beginPath();ctx.ellipse(W*.83,H*.72,Math.min(80,W*.11),48,-.15,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#b5edf2";ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(W*.83,H*.72,Math.min(65,W*.09),36,-.15,0,Math.PI*2);ctx.stroke()}
function drawGrass(g){var gx=g.x/800*W,gy=g.y/500*H,gw=g.w/800*W,gh=g.h/500*H;ctx.fillStyle="#348c4b";ctx.beginPath();ctx.roundRect(gx,gy,gw,gh,12);ctx.fill();for(var i=0;i<35;i++){var x=(g.x+(i*47)%g.w)/800*W,y=(g.y+(i*29)%g.h)/500*H;ctx.strokeStyle=i%2?"#83d65f":"#b2e76b";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y+5);ctx.lineTo(x-3,y-5);ctx.moveTo(x,y+5);ctx.lineTo(x+4,y-7);ctx.stroke()}}
function drawTree(x,y){x=x/800*W;y=y/500*H;ctx.fillStyle="#795438";ctx.fillRect(x-5,y+14,10,24);ctx.fillStyle="#236b45";ctx.beginPath();ctx.arc(x,y,22,0,Math.PI*2);ctx.fill();ctx.fillStyle="#368b50";ctx.beginPath();ctx.arc(x-10,y-8,13,0,Math.PI*2);ctx.fill()}
function drawPerson(x,y,color,label){x=x/800*W;y=y/500*H;ctx.fillStyle="#0003";ctx.beginPath();ctx.ellipse(x,y+17,13,5,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y-8,8,0,Math.PI*2);ctx.fill();rounded(x-8,y,16,19,5,color);ctx.fillStyle="#ffe0bd";ctx.beginPath();ctx.arc(x,y-9,5,0,Math.PI*2);ctx.fill();ctx.fillStyle="#173047";ctx.font="11px sans-serif";ctx.textAlign="center";ctx.fillText(label,x,y+34)}
function draw(){drawGround();grass.forEach(drawGrass);trees.forEach(function(t){drawTree(t[0],t[1])});var bx=W*.32,by=H*.18;rounded(bx,by+20,110,78,8,"#f0e3c5");ctx.fillStyle="#b65c4b";ctx.beginPath();ctx.moveTo(bx-8,by+25);ctx.lineTo(bx+55,by-18);ctx.lineTo(bx+118,by+25);ctx.fill();rounded(bx+43,by+58,24,40,4,"#795438");ctx.fillStyle="#fff";ctx.font="12px sans-serif";ctx.textAlign="center";ctx.fillText("초록마을",bx+55,by+112);drawPerson(W*.28,H*.55,"#e7a34f","마을 주민");var px=player.x/800*W,py=player.y/500*H;ctx.fillStyle="#0003";ctx.beginPath();ctx.ellipse(px,py+15,13,5,0,0,Math.PI*2);ctx.fill();ctx.fillStyle="#315dbe";ctx.beginPath();ctx.arc(px,py-9,9,0,Math.PI*2);ctx.fill();rounded(px-9,py,18,20,5,"#e34d55");ctx.fillStyle="#ffe0bd";ctx.beginPath();ctx.arc(px,py-10,6,0,Math.PI*2);ctx.fill();ctx.fillStyle="#fff";ctx.font="bold 11px sans-serif";ctx.textAlign="center";ctx.fillText("나",px,py-25)}
function inGrass(){return grass.some(function(g){return player.x>g.x&&player.x<g.x+g.w&&player.y>g.y&&player.y<g.y+g.h})}
function move(){if(dialog)return;var dx=0,dy=0;if(keys.left||keys.ArrowLeft)dx--;if(keys.right||keys.ArrowRight)dx++;if(keys.up||keys.ArrowUp)dy--;if(keys.down||keys.ArrowDown)dy++;if(dx||dy){var l=Math.hypot(dx,dy);player.x=Math.max(15,Math.min(785,player.x+dx/l*player.speed));player.y=Math.max(25,Math.min(485,player.y+dy/l*player.speed));if(++steps%22===0&&inGrass()&&Math.random()<.48)startEncounter()}}
function loop(){move();ctx.clearRect(0,0,W,H);draw();requestAnimationFrame(loop)}loop();
function show(html){dialog=true;document.getElementById("panel").innerHTML=html;document.getElementById("dialog").style.display="flex"}function hide(){dialog=false;document.getElementById("dialog").style.display="none"}
function startEncounter(){if(dialog)return;encounter=species[Math.floor(Math.random()*species.length)];show("<h2>⚡ 야생 "+encounter.name+" 등장!</h2><p>레벨 "+encounter.level+" · "+encounter.type+"<br>야생 포켓몬이 풀숲에서 나타났다!</p><div class='actions'><button id='throw'>몬스터볼 던지기 ("+balls+")</button><button id='run' class='secondary'>도망가기</button></div>");document.getElementById("throw").onclick=catchPokemon;document.getElementById("run").onclick=hide}
function catchPokemon(){if(balls<=0){show("<h2>몬스터볼이 부족해!</h2><p>아직 상점은 준비 중이야.</p><div class='actions'><button id='ok'>확인</button></div>");document.getElementById("ok").onclick=hide;return}balls--;document.getElementById("balls").textContent=balls;if(Math.random()<.72){team.push(encounter);document.getElementById("caught").textContent=team.length;show("<h2>🎉 포획 성공!</h2><p>"+encounter.name+"을(를) 동료로 맞이했다!</p><div class='actions'><button id='ok'>계속 모험하기</button></div>")}else{show("<h2>앗! 빠져나왔다!</h2><p>"+encounter.name+"이(가) 몬스터볼에서 탈출했다.</p><div class='actions'><button id='ok'>계속하기</button></div>")}document.getElementById("ok").onclick=hide}
document.getElementById("team").onclick=function(){var list=team.length?team.map(function(p,i){return(i+1)+". "+p.name+" · Lv."+p.level+" · "+p.type}).join("<br>"):"아직 포켓몬이 없어. 풀숲을 탐험해 보자!";show("<h2>🎒 내 포켓몬</h2><p>"+list+"</p><div class='actions'><button id='ok'>닫기</button></div>");document.getElementById("ok").onclick=hide};
document.getElementById("interact").onclick=function(){if(inGrass())startEncounter();else{show("<h2>주변 조사</h2><p>풀숲으로 들어가면 야생 포켓몬을 만날 수 있어. 마을과 연못 주변도 탐험해 보자!</p><div class='actions'><button id='ok'>확인</button></div>");document.getElementById("ok").onclick=hide}};
document.querySelectorAll("[data-dir]").forEach(function(b){var d=b.dataset.dir;b.addEventListener("pointerdown",function(e){e.preventDefault();keys[d]=true;b.setPointerCapture(e.pointerId)});["pointerup","pointercancel","lostpointercapture"].forEach(function(ev){b.addEventListener(ev,function(){keys[d]=false})})});
window.addEventListener("keydown",function(e){if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();keys[e.key]=true});window.addEventListener("keyup",function(e){keys[e.key]=false});document.getElementById("dialog").addEventListener("click",function(e){if(e.target.id==="dialog")hide()});
})();
</script></body></html>
